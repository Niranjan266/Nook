# Nook API — Render Blueprint
#
# Render reads this file from the repo root and creates the service for you, so
# the dashboard form is prefilled and reproducible. In the dashboard:
#   New  →  Blueprint  →  pick the Nook repo  →  Apply
#
# Only the frontend lives on Vercel. This is the always-listening half: Express
# plus Socket.IO plus WebRTC signalling, which a serverless function cannot host
# because it cannot hold a socket open between invocations.

services:
  - type: web
    name: nook-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to India — lowest round-trip for chat
    branch: main

    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server

    # Render restarts the service if this stops returning 2xx. It reports which
    # backing service actually won (turso vs sqlite-file, cloudinary vs
    # local-disk), so a misconfigured deploy is visible rather than silent.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects its own PORT and the Dockerfile defaults to 4000; both
      # agree, and env.js reads process.env.PORT first either way.
      - key: PORT
        value: 4000

      # CORS allow-list. An exact match is required: `credentials: true` with a
      # wildcard origin is silently ignored by browsers.
      - key: CLIENT_ORIGIN
        value: https://nook.niranjand.in

      # How the API refers to itself in media URLs and push payloads. Change
      # this to the custom domain once it is verified.
      - key: PUBLIC_URL
        sync: false

      # Leave EMPTY until nook-api.niranjand.in is live. A server can only set
      # cookies for its own domain, so issuing Domain=.niranjand.in from an
      # onrender.com host makes the browser discard the cookie and nobody stays
      # signed in. Blank falls back to SameSite=None; Secure, which works
      # cross-site.
      - key: COOKIE_DOMAIN
        sync: false

      # sync: false means "prompt me, never store in git". Every secret below
      # is typed into the Render dashboard once.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Generate locally with Make-Keys.bat. Must differ from each other.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Free instances have an ephemeral filesystem that is wiped on every
      # redeploy, restart and spin-down. Without Cloudinary configured the
      # server falls back to local disk and every uploaded photo disappears.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Omit and a throwaway VAPID keypair is generated on every boot, which
      # silently invalidates every existing push subscription on each restart —
      # and free instances restart often.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@niranjand.in

      # Optional. Brevo sends over HTTPS, which matters here: Render blocks
      # outbound SMTP on ports 25, 465 and 587, so a classic SMTP mailer would
      # not work on this platform at all.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: no-reply@niranjand.in
      - key: BREVO_SENDER_NAME
        value: Nook

      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
