<!doctype html>
<html lang="en" data-theme="dark" data-design="midnight-pebble">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Nook — your corner of the internet</title>
    <meta
      name="description"
      content="A private place for the people who matter. Messages, media, voice notes, snaps and calls — no feeds, no reels, no strangers."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#F4F2FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D14" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nook — your corner of the internet" />
    <meta
      property="og:description"
      content="A private place for the people who matter. No feeds, no reels, no strangers."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Here rather than as an @import in tokens.css: a CSS @import is only
         found once the stylesheet has downloaded, a <link> is found at once. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Set the theme before first paint so there is no light flash.
      // Storage is read in its own try: if it is blocked the phone's own
      // light/dark setting still decides, rather than a hardcoded default.
      (function () {
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('nook.ui') || '{}') || {};
        } catch (e) {}
        try {
          var theme = saved.theme || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (saved.accent) document.documentElement.dataset.accent = saved.accent;
        } catch (e) {}
        // The design everyone is on, as last seen: painted now, confirmed by
        // the server once the app boots (lib/design.ts).
        try {
          var design = localStorage.getItem('nook.design');
          if (/^(midnight-pebble|calm|midnight|pebble)$/.test(design || '')) {
            document.documentElement.dataset.design = design;
          }
        } catch (e) {}
      })();

      // Knock on the API before the app's code has even downloaded. If the
      // server was asleep it starts waking now, a second or two sooner, and
      // on the sign-in page it gets the whole time someone spends typing.
      (function () {
        var api = '%VITE_API_URL%';
        if (api.charAt(0) === '%') api = ''; // unset: dev, same-origin proxy
        try {
          fetch(api.replace(/\/+$/, '') + '/api/health', { mode: 'no-cors', keepalive: true }).catch(
            function () {}
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
