<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nook</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /*
        Shown by the Android app when it cannot reach nook.niranjand.in.
        Bundled inside the APK, so it is the one page guaranteed to load with
        no connection at all.

        It exists because the alternative is the WebView's own error page —
        a white screen reading "net::ERR_NAME_NOT_RESOLVED", which tells
        somebody holding a phone precisely nothing and looks exactly like the
        app being broken. "Not working" is a report nobody can act on; this
        turns it into one sentence that names the cause.
      */
      :root {
        --bg: #e9e1d6;
        --card: #f4eee6;
        --ink: #1e1a17;
        --muted: #5c5349;
        --accent: #c0603c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #201d1a;
          --card: #2a2622;
          --ink: #f2ece4;
          --muted: #a99e92;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }

      .card {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-size: 26px;
      }

      h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: -0.01em; }
      p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }

      button {
        width: 100%;
        padding: 14px 20px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: var(--accent);
        color: #fdf8f2;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 4px 4px 0 var(--ink);
        cursor: pointer;
      }
      button:active { transform: translate(4px, 4px); box-shadow: none; }

      .hint { margin: 16px 0 0; font-size: 13px; }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="mark">🌙</div>
      <h1>Nook can't reach the server</h1>
      <p id="why">Check your connection and try again.</p>
      <button id="retry">Try again</button>
      <p class="hint muted" id="detail"></p>
    </div>

    <script>
      /*
        Retry by going back to the real app rather than reloading this page —
        reloading an error page just shows the error page again, which is the
        kind of dead end that makes people uninstall.
      */
      var HOME = 'https://nook.niranjand.in/';

      document.getElementById('retry').addEventListener('click', function () {
        window.location.replace(HOME);
      });

      // Distinguish "your phone is offline" from "the server is down", because
      // the two need completely different things from the person reading this.
      if (navigator.onLine === false) {
        document.getElementById('why').textContent =
          'Your phone has no internet connection right now.';
      } else {
        document.getElementById('why').textContent =
          'Your phone is online, so this is probably the server waking up. It sleeps when quiet and takes about a minute.';
      }

      // Come back on its own the moment the connection returns.
      window.addEventListener('online', function () {
        window.location.replace(HOME);
      });
    </script>
  </body>
</html>
