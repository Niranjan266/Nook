<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nook</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /*
        Shown by the Android app when it cannot reach nook.niranjand.in.
        Bundled inside the APK, so it is the one page guaranteed to load with
        no connection at all.

        It exists because the alternative is the WebView's own error page —
        a white screen reading "net::ERR_NAME_NOT_RESOLVED", which tells
        somebody holding a phone precisely nothing and looks exactly like the
        app being broken. "Not working" is a report nobody can act on; this
        turns it into one sentence that names the cause.
      */
      /* tokens.css's values, copied: this page cannot load the app's CSS. */
      :root {
        --bg: #f4f2fb;
        --card: #ffffff;
        --ink: #1f1b2e;
        --muted: #5e5875;
        --accent: #5443d6;
        --on-accent: #ffffff;
        --shadow: 0 10px 34px rgba(84, 67, 214, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0d14;
          --card: #18161f;
          --ink: #f4f2fa;
          --muted: #a9a4ba;
          --accent: #c8f545;
          --on-accent: #0e0d14;
          --shadow: 0 14px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Nunito', ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }

      .card {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 22px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .mark {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
      }

      /* No web font can load here, so the display stack is the phone's own. */
      h1 {
        margin: 0 0 8px;
        font-family: 'Fredoka', 'Nunito', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 600;
      }
      p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }

      button {
        width: 100%;
        min-height: 48px;
        padding: 14px 20px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 90ms cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      button:active { transform: scale(0.96); }

      .hint { margin: 16px 0 0; font-size: 13px; }
    </style>
  </head>

  <body>
    <div class="card">
      <!-- The mark, inline: this page must render with no network at all. -->
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="13" fill="#0E0D14" />
        <g transform="translate(24 24) scale(0.82) translate(-24 -25)">
          <ellipse cx="31" cy="22" rx="11" ry="13" fill="#C8F545" fill-opacity="0.92" />
          <ellipse cx="19" cy="26" rx="13" ry="15" fill="#8B7CFF" />
          <circle cx="16" cy="25" r="2" fill="#0E0D14" />
          <circle cx="22" cy="25" r="2" fill="#0E0D14" />
        </g>
      </svg>
      <h1>Nook can't reach the server</h1>
      <p id="why">Check your connection and try again.</p>
      <button id="retry">Try again</button>
      <p class="hint muted" id="detail"></p>
    </div>

    <script>
      /*
        Retry by going back to the real app rather than reloading this page —
        reloading an error page just shows the error page again, which is the
        kind of dead end that makes people uninstall.
      */
      var HOME = 'https://nook.niranjand.in/';

      document.getElementById('retry').addEventListener('click', function () {
        window.location.replace(HOME);
      });

      // Distinguish "your phone is offline" from "the server is down", because
      // the two need completely different things from the person reading this.
      if (navigator.onLine === false) {
        document.getElementById('why').textContent =
          'Your phone has no internet connection right now.';
      } else {
        document.getElementById('why').textContent =
          'Your phone is online, so this is probably the server waking up. It sleeps when quiet and takes about a minute.';
      }

      // Come back on its own the moment the connection returns.
      window.addEventListener('online', function () {
        window.location.replace(HOME);
      });
    </script>
  </body>
</html>
