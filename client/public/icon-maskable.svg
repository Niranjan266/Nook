<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed: the platform cuts its own shape. The pair stays inside the
       central 40%-radius safe circle (it reaches ~144px from the middle). -->
  <rect width="512" height="512" fill="#0E0D14"/>
  <g transform="translate(256 256) scale(8) translate(-24 -25)">
    <ellipse cx="31" cy="22" rx="11" ry="13" fill="#C8F545" fill-opacity="0.92"/>
    <ellipse cx="19" cy="26" rx="13" ry="15" fill="#8B7CFF"/>
    <circle cx="16" cy="25" r="2" fill="#0E0D14"/>
    <circle cx="22" cy="25" r="2" fill="#0E0D14"/>
  </g>
</svg>
