<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Nook">
  <title>Nook</title>
  <defs>
    <linearGradient id="clayFace" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F6F1E9"/>
      <stop offset="0.55" stop-color="#EDE3D6"/>
      <stop offset="1" stop-color="#DCCDB9"/>
    </linearGradient>
    <linearGradient id="alcove" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#A9502F"/>
      <stop offset="1" stop-color="#C0603C"/>
    </linearGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E1A17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- the room -->
  <rect x="6" y="6" width="84" height="84" rx="26" fill="url(#clayFace)"/>
  <rect x="6" y="6" width="84" height="84" rx="26" fill="none" stroke="#1E1A17" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- the nook: an alcove cut into the room, which also reads as a lowercase n -->
  <g filter="url(#soften)">
    <path d="M32 74 V46 a16 16 0 0 1 32 0 V74 Z" fill="url(#alcove)"/>
  </g>

  <!-- light catching the left wall of the alcove -->
  <path d="M32 74 V46 a16 16 0 0 1 6.6 -12.9 l3.4 4.8 A11 11 0 0 0 38 46 V74 Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- floor of the nook -->
  <rect x="32" y="70" width="32" height="4" fill="#1E1A17" fill-opacity="0.18"/>
</svg>
