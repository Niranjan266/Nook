server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must never be cached, or clients get stuck on an old
  # one and stop receiving push notifications.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
  }

  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    expires 30d;
  }

  # Socket.IO needs the upgrade headers, and a long read timeout or idle
  # connections get cut every 60 seconds.
  location /socket.io/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
